[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinpfn"
version = "1.1.0"
description = "A prior-fitted network for small-sample tabular classification, pretrained on synthetic tables and validated on public credit portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-NC-4.0"}
authors = [{name = "Javier Mancilla Montero"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.2", "safetensors>=0.4", "pyarrow>=14"]

[project.optional-dependencies]
benchmark = ["xgboost>=2.0", "tabpfn==2.0.9", "matplotlib>=3.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["thinpfn*"]

[tool.setuptools.package-data]
thinpfn = ["weights/*.safetensors", "weights/*.json"]
